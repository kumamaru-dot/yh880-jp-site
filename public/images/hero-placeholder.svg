<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#152032"/>
    </linearGradient>
    <linearGradient id="floor-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2840"/>
      <stop offset="100%" stop-color="#111d2e"/>
    </linearGradient>
    <linearGradient id="tank-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d3e52"/>
      <stop offset="100%" stop-color="#1e2d40"/>
    </linearGradient>
    <linearGradient id="liq-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="mc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="badge-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2418"/>
      <stop offset="100%" stop-color="#071812"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60,0 L0,0 L0,60" stroke="#1e2d40" stroke-width="1" fill="none"/>
    </pattern>
    <pattern id="dirty" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#44200a"/>
      <line x1="0" y1="0" x2="10" y2="10" stroke="#5c2e0e" stroke-width="1.5" opacity="0.6"/>
    </pattern>
    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="gw"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)" opacity="0.25"/>

