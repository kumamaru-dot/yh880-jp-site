<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="tunnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="train-s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="depot-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2d40" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Tunnel/depot background -->
  <rect width="600" height="400" fill="url(#tunnel)"/>
  <rect width="600" height="400" fill="url(#depot-light)"/>

  <!-- Tunnel arch -->
  <path d="M0,280 Q0,20 300,20 Q600,20 600,280" fill="#0f1825" stroke="#1e2d40" stroke-width="3"/>
  <!-- Tunnel wall tiles -->
  <path d="M0,280 Q0,40 300,40 Q600,40 600,280" fill="none" stroke="#1a2840" stroke-width="1.5" opacity="0.6"/>
  <!-- Tile pattern on walls -->
  <line x1="80" y1="60" x2="100" y2="280" stroke="#1e2d40" stroke-width="1" opacity="0.5"/>
  <line x1="160" y1="40" x2="170" y2="280" stroke="#1e2d40" stroke-width="1" opacity="0.4"/>
  <line x1="240" y1="30" x2="244" y2="280" stroke="#1e2d40" stroke-width="1" opacity="0.4"/>
  <line x1="360" y1="30" x2="356" y2="280" stroke="#1e2d40" stroke-width="1" opacity="0.4"/>
  <line x1="440" y1="40" x2="430" y2="280" stroke="#1e2d40" stroke-width="1" opacity="0.4"/>
  <line x1="520" y1="60" x2="500" y2="280" stroke="#1e2d40" stroke-width="1" opacity="0.5"/>

  <!-- Platform / floor -->
  <rect x="0" y="280" width="600" height="120" fill="#111827"/>
  <rect x="0" y="280" width="600" height="4" fill="#1e2d40"/>
  <!-- Platform tiles -->
  <rect x="0" y="284" width="600" height="60" fill="#0f172a"/>
  <line x1="0" y1="310" x2="600" y2="310" stroke="#1e2d40" stroke-width="1"/>
  <line x1="60" y1="284" x2="60" y2="344" stroke="#1e2d40" stroke-width="1"/>
  <line x1="120" y1="284" x2="120" y2="344" stroke="#1e2d40" stroke-width="1"/>
  <line x1="180" y1="284" x2="180" y2="344" stroke="#1e2d40" stroke-width="1"/>
  <line x1="240" y1="284" x2="240" y2="344" stroke="#1e2d40" stroke-width="1"/>
  <line x1="300" y1="284" x2="300" y2="344" stroke="#1e2d40" stroke-width="1"/>
  <line x1="360" y1="284" x2="360" y2="344" stroke="#1e2d40" stroke-width="1"/>
  <line x1="420" y1="284" x2="420" y2="344" stroke="#1e2d40" stroke-width="1"/>
  <line x1="480" y1="284" x2="480" y2="344" stroke="#1e2d40" stroke-width="1"/>
  <line x1="540" y1="284" x2="540" y2="344" stroke="#1e2d40" stroke-width="1"/>

  <!-- Rails -->
  <rect x="0" y="268" width="600" height="6" rx="2" fill="#374151"/>
  <rect x="0" y="276" width="600" height="4" rx="1" fill="#2d3e52"/>

  <!-- Overhead lights in depot -->
  <rect x="80" y="40" width="20" height="8" rx="2" fill="#374151"/>
  <ellipse cx="90" cy="52" rx="28" ry="18" fill="#fbbf24" opacity="0.1"/>
  <rect x="280" y="30" width="20" height="8" rx="2" fill="#374151"/>
  <ellipse cx="290" cy="42" rx="28" ry="18" fill="#fbbf24" opacity="0.12"/>
  <rect x="480" y="40" width="20" height="8" rx="2" fill="#374151"/>
  <ellipse cx="490" cy="52" rx="28" ry="18" fill="#fbbf24" opacity="0.1"/>

  <!-- === METRO TRAIN BODY === -->
  <!-- Car 1 -->
  <rect x="30" y="150" width="240" height="120" rx="10" fill="url(#train-s)"/>
  <rect x="30" y="150" width="240" height="120" rx="10" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <!-- White stripe -->
  <rect x="30" y="172" width="240" height="10" fill="white" opacity="0.15"/>
  <!-- Windows -->
  <rect x="50" y="165" width="42" height="32" rx="3" fill="#0c1a28" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="102" y="165" width="42" height="32" rx="3" fill="#0c1a28" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="154" y="165" width="42" height="32" rx="3" fill="#0c1a28" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="206" y="165" width="40" height="32" rx="3" fill="#0c1a28" stroke="#1e40af" stroke-width="1.5"/>
  <!-- Window light -->
  <rect x="52" y="167" width="38" height="8" fill="white" opacity="0.06"/>
  <rect x="104" y="167" width="38" height="8" fill="white" opacity="0.06"/>
  <rect x="156" y="167" width="38" height="8" fill="white" opacity="0.06"/>
  <!-- Door -->
  <rect x="128" y="200" width="44" height="70" rx="2" fill="#1d4ed8" stroke="#1e40af" stroke-width="1.5"/>
  <line x1="150" y1="200" x2="150" y2="270" stroke="#1e40af" stroke-width="1.5"/>
  <!-- Car number -->
  <text x="60" y="240" font-family="sans-serif" font-size="11" fill="white" opacity="0.4">01</text>

  <!-- Connector between cars -->
  <rect x="270" y="190" width="20" height="60" rx="3" fill="#1e2535"/>

  <!-- Car 2 (partial) -->
  <rect x="290" y="150" width="260" height="120" rx="10" fill="url(#train-s)"/>
  <rect x="290" y="150" width="260" height="120" rx="10" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="290" y="172" width="260" height="10" fill="white" opacity="0.15"/>
  <rect x="310" y="165" width="42" height="32" rx="3" fill="#0c1a28" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="362" y="165" width="42" height="32" rx="3" fill="#0c1a28" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="414" y="165" width="42" height="32" rx="3" fill="#0c1a28" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="466" y="165" width="42" height="32" rx="3" fill="#0c1a28" stroke="#1e40af" stroke-width="1.5"/>

  <!-- Car 2 undercarriage (being cleaned) -->
  <rect x="310" y="268" width="180" height="14" rx="3" fill="#1a2535"/>
  <!-- Oil coating on undercarriage -->
  <rect x="310" y="268" width="90" height="14" rx="3" fill="#44200a" opacity="0.6"/>
  <!-- Cleaning spray on right half -->
  <circle cx="420" cy="260" r="4" fill="#7dd3fc" opacity="0.7"/>
  <circle cx="440" cy="255" r="3.5" fill="#38bdf8" opacity="0.65"/>
  <circle cx="450" cy="264" r="4.5" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="460" cy="258" r="3" fill="#bae6fd" opacity="0.65"/>
  <circle cx="432" cy="266" r="3" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="470" cy="268" r="4" fill="#38bdf8" opacity="0.55"/>

  <!-- Cleaning worker -->
  <rect x="520" y="245" width="28" height="36" rx="4" fill="#334155"/>
  <circle cx="534" cy="238" r="12" fill="#475569"/>
  <!-- Spray hose -->
  <path d="M520,260 Q500,252 480,260 Q464,266 456,262" stroke="#374151" stroke-width="4" fill="none"/>
  <polygon points="456,258 456,266 444,262" fill="#22c55e"/>

  <!-- Before/After labels on undercarriage -->
  <rect x="312" y="270" width="46" height="16" rx="2" fill="#44200a" opacity="0.85"/>
  <text x="335" y="282" font-family="sans-serif" font-size="9" font-weight="700" fill="#d97706" text-anchor="middle">洗浄前</text>
  <rect x="400" y="270" width="46" height="16" rx="2" fill="#064e3b" opacity="0.85"/>
  <text x="423" y="282" font-family="sans-serif" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle">洗浄後</text>

  <!-- Label strip -->
  <rect x="0" y="358" width="600" height="42" fill="#071812" opacity="0.9"/>
  <rect x="0" y="358" width="600" height="2" fill="#22c55e" opacity="0.5"/>
  <text x="300" y="377" font-family="sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">インフラ・交通 ｜ 地下鉄設備のメンテナンス洗浄</text>
  <text x="300" y="393" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Infrastructure / Metro &amp; Subway Maintenance Cleaning</text>
</svg>
