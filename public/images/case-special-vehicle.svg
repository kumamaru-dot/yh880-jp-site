<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-sv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2535"/>
      <stop offset="100%" stop-color="#0f1520"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="ground-sv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2e20"/>
      <stop offset="100%" stop-color="#111d14"/>
    </linearGradient>
    <pattern id="camo" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#374151"/>
      <rect x="0" y="0" width="20" height="20" fill="#3d4b30" opacity="0.4"/>
      <rect x="20" y="20" width="20" height="20" fill="#2d3a25" opacity="0.3"/>
      <rect x="10" y="5" width="15" height="15" fill="#4a5c38" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="url(#bg-sv)"/>

  <!-- Ground/terrain -->
  <rect x="0" y="300" width="600" height="100" fill="url(#ground-sv)"/>
  <rect x="0" y="300" width="600" height="3" fill="#2d3a25" opacity="0.5"/>
  <!-- Ground texture -->
  <line x1="0" y1="316" x2="600" y2="316" stroke="#243220" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="332" x2="600" y2="332" stroke="#1e2a1a" stroke-width="1" opacity="0.3"/>

  <!-- Background: distant smoke/exhaust -->
  <ellipse cx="500" cy="120" rx="60" ry="40" fill="#1a2535" opacity="0.5"/>
  <ellipse cx="480" cy="100" rx="40" ry="28" fill="#1e2d20" opacity="0.4"/>

  <!-- === SPECIAL VEHICLE BODY === -->
  <!-- Tracks -->
  <!-- Left track -->
  <rect x="40" y="278" width="280" height="30" rx="6" fill="#1a2535" stroke="#374151" stroke-width="2"/>
  <rect x="40" y="282" width="280" height="8" fill="#243246"/>
  <!-- Track links (visible segments) -->
  <rect x="50" y="278" width="20" height="30" rx="1" fill="#2d3e52" stroke="#374151" stroke-width="0.5"/>
  <rect x="80" y="278" width="20" height="30" rx="1" fill="#243246" stroke="#374151" stroke-width="0.5"/>
  <rect x="110" y="278" width="20" height="30" rx="1" fill="#2d3e52" stroke="#374151" stroke-width="0.5"/>
  <rect x="140" y="278" width="20" height="30" rx="1" fill="#243246" stroke="#374151" stroke-width="0.5"/>
  <rect x="170" y="278" width="20" height="30" rx="1" fill="#2d3e52" stroke="#374151" stroke-width="0.5"/>
  <rect x="200" y="278" width="20" height="30" rx="1" fill="#243246" stroke="#374151" stroke-width="0.5"/>
  <rect x="230" y="278" width="20" height="30" rx="1" fill="#2d3e52" stroke="#374151" stroke-width="0.5"/>
  <rect x="260" y="278" width="20" height="30" rx="1" fill="#243246" stroke="#374151" stroke-width="0.5"/>
  <!-- Drive wheels on track -->
  <circle cx="66" cy="290" r="22" fill="#1a2535" stroke="#4b5563" stroke-width="2"/>
  <circle cx="66" cy="290" r="14" fill="#111d2e"/>
  <circle cx="66" cy="290" r="6" fill="#374151"/>
  <circle cx="290" cy="290" r="22" fill="#1a2535" stroke="#4b5563" stroke-width="2"/>
  <circle cx="290" cy="290" r="14" fill="#111d2e"/>
  <circle cx="290" cy="290" r="6" fill="#374151"/>
  <!-- Road wheels -->
  <circle cx="130" cy="295" r="14" fill="#1a2535" stroke="#374151" stroke-width="1.5"/>
  <circle cx="180" cy="295" r="14" fill="#1a2535" stroke="#374151" stroke-width="1.5"/>
  <circle cx="230" cy="295" r="14" fill="#1a2535" stroke="#374151" stroke-width="1.5"/>

  <!-- Main hull -->
  <rect x="55" y="180" width="280" height="100" rx="6" fill="url(#camo)" stroke="#4b5563" stroke-width="2"/>
  <!-- Hull top plate -->
  <polygon points="55,180 335,180 350,160 40,160" fill="url(#hull)" stroke="#4b5563" stroke-width="2"/>
  <!-- Armor plate details -->
  <rect x="60" y="182" width="80" height="18" rx="2" fill="#3d4b30" opacity="0.5"/>
  <rect x="155" y="182" width="80" height="18" rx="2" fill="#3d4b30" opacity="0.4"/>
  <rect x="250" y="182" width="80" height="18" rx="2" fill="#3d4b30" opacity="0.5"/>

  <!-- Turret -->
  <ellipse cx="200" cy="158" rx="75" ry="30" fill="#4b5563" stroke="#6b7280" stroke-width="2"/>
  <!-- Gun barrel -->
  <rect x="240" y="152" width="120" height="12" rx="4" fill="#374151"/>
  <rect x="350" y="154" width="20" height="8" rx="2" fill="#4b5563"/>
  <!-- Hatch -->
  <ellipse cx="180" cy="150" rx="18" ry="10" fill="#374151" stroke="#4b5563" stroke-width="1.5"/>
  <!-- Periscope -->
  <rect x="170" y="140" width="8" height="14" rx="2" fill="#4b5563"/>
  <rect x="168" y="138" width="12" height="6" rx="1" fill="#64748b"/>

  <!-- Oil/grease on lower hull and track (left side) -->
  <rect x="55" y="230" width="140" height="48" fill="#44200a" opacity="0.45" rx="4"/>
  <rect x="40" y="278" width="140" height="30" fill="#3d1c08" opacity="0.5" rx="6"/>
  <!-- Oil drips -->
  <path d="M90,308 Q90,320 92,328" stroke="#3d1c08" stroke-width="3" fill="none"/>
  <ellipse cx="92" cy="330" rx="4" ry="6" fill="#3d1c08"/>
  <path d="M120,308 Q120,316 121,322" stroke="#44200a" stroke-width="2.5" fill="none"/>
  <ellipse cx="121" cy="324" rx="3" ry="5" fill="#44200a"/>

  <!-- Cleaning crew (right side) -->
  <!-- Worker 1 -->
  <rect x="390" y="250" width="28" height="50" rx="4" fill="#1b5e43"/>
  <circle cx="404" cy="242" r="12" fill="#475569"/>
  <!-- Worker 2 -->
  <rect x="430" y="248" width="28" height="52" rx="4" fill="#1b5e43"/>
  <circle cx="444" cy="240" r="12" fill="#475569"/>

  <!-- High-pressure spray system -->
  <rect x="460" y="220" width="80" height="50" rx="4" fill="#334155" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="464" y="224" width="72" height="20" rx="2" fill="#243246"/>
  <text x="500" y="237" font-family="monospace" font-size="8" fill="#22c55e" text-anchor="middle">HIGH-P</text>
  <rect x="464" y="252" width="72" height="12" rx="2" fill="#22c55e" opacity="0.15"/>

  <!-- Spray hoses -->
  <path d="M460,245 Q440,250 416,255" stroke="#374151" stroke-width="5" fill="none"/>
  <polygon points="416,251 416,259 404,255" fill="#22c55e"/>

  <path d="M460,245 Q450,238 434,242" stroke="#374151" stroke-width="4" fill="none"/>
  <polygon points="434,238 434,246 422,242" fill="#22c55e"/>

  <!-- Spray water on hull -->
  <circle cx="260" cy="200" r="4" fill="#7dd3fc" opacity="0.7"/>
  <circle cx="285" cy="210" r="3.5" fill="#38bdf8" opacity="0.65"/>
  <circle cx="300" cy="196" r="4.5" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="315" cy="218" r="3" fill="#bae6fd" opacity="0.65"/>
  <circle cx="275" cy="222" r="4" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="298" cy="232" r="3.5" fill="#38bdf8" opacity="0.55"/>
  <circle cx="322" cy="205" r="3" fill="#bae6fd" opacity="0.6"/>
  <!-- Clean surface right hull -->
  <rect x="200" y="182" width="130" height="96" fill="#475569" opacity="0.3" rx="4"/>

  <!-- Before/after labels -->
  <rect x="58" y="188" width="50" height="18" rx="2" fill="#44200a" opacity="0.85"/>
  <text x="83" y="201" font-family="sans-serif" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">洗浄前</text>
  <rect x="218" y="188" width="50" height="18" rx="2" fill="#064e3b" opacity="0.85"/>
  <text x="243" y="201" font-family="sans-serif" font-size="10" font-weight="700" fill="#22c55e" text-anchor="middle">洗浄後</text>

  <!-- Label strip -->
  <rect x="0" y="358" width="600" height="42" fill="#071812" opacity="0.9"/>
  <rect x="0" y="358" width="600" height="2" fill="#22c55e" opacity="0.5"/>
  <text x="300" y="377" font-family="sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">特殊車両 ｜ 特殊設備の脱脂洗浄</text>
  <text x="300" y="393" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Special Vehicles / Heavy Equipment Degreasing</text>
</svg>
