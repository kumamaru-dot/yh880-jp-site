<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="sky-o" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#2d1b0e"/>
    </linearGradient>
    <linearGradient id="ground-o" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1008"/>
      <stop offset="100%" stop-color="#0f0904"/>
    </linearGradient>
    <pattern id="oildirt" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#3d1c08"/>
      <line x1="0" y1="0" x2="8" y2="8" stroke="#5c2e0e" stroke-width="1.2" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="url(#sky-o)"/>

  <!-- Ground/mud -->
  <rect x="0" y="300" width="600" height="100" fill="url(#ground-o)"/>
  <rect x="0" y="300" width="600" height="3" fill="#44200a" opacity="0.6"/>

  <!-- Distant glow (flare) -->
  <ellipse cx="520" cy="80" rx="40" ry="60" fill="#d97706" opacity="0.08"/>
  <ellipse cx="520" cy="60" rx="12" ry="30" fill="#f59e0b" opacity="0.2"/>
  <line x1="520" y1="300" x2="520" y2="30" stroke="#f59e0b" stroke-width="3" opacity="0.15"/>

  <!-- Oil derrick (center-left) -->
  <!-- Tower body -->
  <polygon points="200,30 220,30 280,295 140,295" fill="none" stroke="#374151" stroke-width="2"/>
  <polygon points="200,30 220,30 280,295 140,295" fill="#1e2535" opacity="0.8"/>
  <!-- Crossbars -->
  <line x1="162" y1="100" x2="258" y2="100" stroke="#374151" stroke-width="1.5"/>
  <line x1="152" y1="150" x2="268" y2="150" stroke="#374151" stroke-width="1.5"/>
  <line x1="148" y1="200" x2="272" y2="200" stroke="#374151" stroke-width="1.5"/>
  <line x1="144" y1="250" x2="276" y2="250" stroke="#374151" stroke-width="1.5"/>
  <!-- Crown block -->
  <rect x="194" y="18" width="32" height="18" rx="3" fill="#374151"/>
  <!-- Travelling block/cable -->
  <line x1="210" y1="36" x2="210" y2="200" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Drill string/pipe going down -->
  <rect x="206" y="200" width="8" height="100" fill="#475569"/>

  <!-- Pump jack (right) -->
  <rect x="380" y="250" width="80" height="50" rx="4" fill="#334155"/>
  <!-- Walking beam -->
  <rect x="370" y="235" width="110" height="12" rx="4" fill="#475569" transform="rotate(-8, 425, 241)"/>
  <!-- Crank -->
  <circle cx="440" cy="270" r="22" fill="#2d3e52" stroke="#475569" stroke-width="2"/>
  <line x1="440" y1="270" x2="452" y2="252" stroke="#64748b" stroke-width="3"/>
  <!-- Horse head -->
  <rect x="365" y="218" width="30" height="20" rx="4" fill="#374151"/>
  <!-- Polished rod -->
  <rect x="374" y="238" width="8" height="62" fill="#64748b"/>

  <!-- Oil pipes on ground -->
  <rect x="50" y="310" width="200" height="22" rx="8" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <rect x="50" y="316" width="200" height="8" fill="#3d5470" opacity="0.5"/>
  <rect x="100" y="344" width="140" height="18" rx="6" fill="#334155" stroke="#475569" stroke-width="1.5"/>

  <!-- Oil coating / drip on pipe (left half) -->
  <rect x="50" y="310" width="100" height="22" fill="url(#oildirt)" rx="8" clip-path="url(#pipe-left)"/>
  <clipPath id="pipe-left"><rect x="50" y="310" width="100" height="22" rx="8"/></clipPath>
  <rect x="50" y="310" width="100" height="22" fill="#44200a" opacity="0.6" rx="8"/>
  <!-- Oil drip -->
  <path d="M100,332 Q100,345 102,352" stroke="#3d1c08" stroke-width="3" fill="none"/>
  <ellipse cx="102" cy="354" rx="5" ry="7" fill="#3d1c08"/>
  <path d="M130,332 Q130,340 131,346" stroke="#44200a" stroke-width="2.5" fill="none"/>
  <ellipse cx="131" cy="348" rx="4" ry="5" fill="#44200a"/>

  <!-- Clean pipe (right half) with spray -->
  <rect x="150" y="310" width="100" height="22" fill="#475569" rx="8" opacity="0.8"/>
  <rect x="152" y="312" width="96" height="8" fill="white" opacity="0.05"/>

  <!-- Spray nozzle on right -->
  <rect x="264" y="308" width="30" height="10" rx="3" fill="#374151"/>
  <polygon points="264,308 264,318 252,313" fill="#22c55e"/>
  <circle cx="236" cy="313" r="3.5" fill="#7dd3fc" opacity="0.7"/>
  <circle cx="220" cy="309" r="3" fill="#38bdf8" opacity="0.65"/>
  <circle cx="228" cy="320" r="4" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="210" cy="316" r="2.5" fill="#bae6fd" opacity="0.6"/>

  <!-- Before/After labels -->
  <rect x="52" y="314" width="54" height="18" rx="2" fill="#44200a" opacity="0.85"/>
  <text x="79" y="327" font-family="sans-serif" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">洗浄前</text>
  <rect x="152" y="314" width="54" height="18" rx="2" fill="#064e3b" opacity="0.85"/>
  <text x="179" y="327" font-family="sans-serif" font-size="10" font-weight="700" fill="#22c55e" text-anchor="middle">洗浄後</text>

  <!-- Label strip -->
  <rect x="0" y="358" width="600" height="42" fill="#071812" opacity="0.9"/>
  <rect x="0" y="358" width="600" height="2" fill="#22c55e" opacity="0.5"/>
  <text x="300" y="377" font-family="sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">石油・ガス ｜ 油田ワークオーバーリグの原油汚れ洗浄</text>
  <text x="300" y="393" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Oil &amp; Gas / Oilfield Equipment Degreasing</text>
</svg>
