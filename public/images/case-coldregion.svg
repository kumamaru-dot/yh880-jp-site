<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1825"/>
      <stop offset="50%" stop-color="#1a2a3a"/>
      <stop offset="100%" stop-color="#0f1520"/>
    </linearGradient>
    <linearGradient id="snow-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="equip-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="frozen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>
    <filter id="frost">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg-c)"/>

  <!-- Night sky stars -->
  <circle cx="50" cy="30" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="120" cy="15" r="1" fill="white" opacity="0.5"/>
  <circle cx="200" cy="25" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="300" cy="10" r="1" fill="white" opacity="0.4"/>
  <circle cx="380" cy="22" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="450" cy="8" r="1" fill="white" opacity="0.5"/>
  <circle cx="520" cy="30" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="560" cy="16" r="1" fill="white" opacity="0.4"/>
  <circle cx="160" cy="50" r="1" fill="white" opacity="0.3"/>
  <circle cx="340" cy="45" r="1" fill="white" opacity="0.3"/>
  <circle cx="490" cy="55" r="1.5" fill="white" opacity="0.5"/>

  <!-- Ground (snow) -->
  <rect x="0" y="300" width="600" height="100" fill="url(#snow-g)"/>
  <rect x="0" y="300" width="600" height="4" fill="white" opacity="0.3"/>
  <!-- Snow drifts -->
  <ellipse cx="150" cy="302" rx="80" ry="10" fill="white" opacity="0.2"/>
  <ellipse cx="420" cy="302" rx="100" ry="12" fill="white" opacity="0.15"/>
  <ellipse cx="540" cy="304" rx="60" ry="8" fill="white" opacity="0.2"/>

  <!-- Temperature gauge (left) -->
  <rect x="28" y="80" width="56" height="180" rx="8" fill="#111d2e" stroke="#243246" stroke-width="2"/>
  <rect x="38" y="90" width="36" height="150" rx="4" fill="#0a1520"/>
  <!-- Thermometer tube -->
  <rect x="48" y="100" width="16" height="130" rx="8" fill="#0f172a" stroke="#243246" stroke-width="1"/>
  <!-- Mercury/reading at -3°C (red, low position) -->
  <rect x="50" y="170" width="12" height="60" rx="6" fill="#ef4444" opacity="0.9"/>
  <circle cx="56" cy="232" r="10" fill="#ef4444"/>
  <!-- Scale marks -->
  <line x1="44" y1="108" x2="52" y2="108" stroke="#4b5563" stroke-width="1"/>
  <line x1="44" y1="122" x2="52" y2="122" stroke="#4b5563" stroke-width="1"/>
  <line x1="44" y1="136" x2="52" y2="136" stroke="#4b5563" stroke-width="1"/>
  <line x1="44" y1="150" x2="52" y2="150" stroke="#4b5563" stroke-width="1"/>
  <line x1="44" y1="164" x2="52" y2="164" stroke="#4b5563" stroke-width="1"/>
  <line x1="44" y1="178" x2="52" y2="178" stroke="#4b5563" stroke-width="1"/>
  <!-- Scale labels -->
  <text x="70" y="112" font-family="monospace" font-size="9" fill="#94a3b8">+20</text>
  <text x="70" y="140" font-family="monospace" font-size="9" fill="#94a3b8">+10</text>
  <text x="70" y="168" font-family="monospace" font-size="9" fill="#94a3b8">0</text>
  <text x="70" y="182" font-family="monospace" font-size="9" fill="#ef4444" font-weight="700">-3°</text>
  <!-- Temp readout box -->
  <rect x="22" y="260" width="68" height="26" rx="4" fill="#0a1520" stroke="#ef4444" stroke-width="1.5"/>
  <text x="56" y="277" font-family="monospace" font-size="14" font-weight="700" fill="#ef4444" text-anchor="middle">-3°C</text>

  <!-- === INDUSTRIAL EQUIPMENT (pipe/valve assembly) === -->
  <!-- Main horizontal pipe -->
  <rect x="140" y="190" width="320" height="50" rx="10" fill="url(#equip-c)" stroke="#4b5563" stroke-width="2.5"/>
  <rect x="140" y="190" width="320" height="14" rx="6" fill="white" opacity="0.05"/>

  <!-- Flanges -->
  <rect x="130" y="178" width="22" height="74" rx="4" fill="#374151" stroke="#4b5563" stroke-width="1.5"/>
  <rect x="468" y="178" width="22" height="74" rx="4" fill="#374151" stroke="#4b5563" stroke-width="1.5"/>

  <!-- Ice/frost formation on pipe (left half) -->
  <rect x="140" y="190" width="160" height="50" fill="#bfdbfe" opacity="0.18" rx="8" clip-path="url(#pipe-half)"/>
  <clipPath id="pipe-half"><rect x="140" y="190" width="160" height="50"/></clipPath>
  <!-- Frost crystals on left -->
  <polygon points="160,190 163,180 166,190" fill="#e0f2fe" opacity="0.4"/>
  <polygon points="180,192 183,180 186,192" fill="#bfdbfe" opacity="0.35"/>
  <polygon points="200,190 203,179 206,190" fill="#e0f2fe" opacity="0.4"/>
  <polygon points="220,192 223,181 226,192" fill="#bfdbfe" opacity="0.35"/>
  <polygon points="245,190 248,179 251,190" fill="#e0f2fe" opacity="0.3"/>
  <!-- Ice icicles -->
  <path d="M155,240 L157,256 L159,240" fill="#e0f2fe" opacity="0.5"/>
  <path d="M175,240 L177,262 L179,240" fill="#bfdbfe" opacity="0.45"/>
  <path d="M195,240 L197,252 L199,240" fill="#e0f2fe" opacity="0.5"/>
  <path d="M215,240 L217,258 L219,240" fill="#bfdbfe" opacity="0.4"/>
  <path d="M235,240 L237,250 L239,240" fill="#e0f2fe" opacity="0.45"/>
  <path d="M255,240 L257,255 L259,240" fill="#bfdbfe" opacity="0.4"/>
  <path d="M275,240 L277,248 L279,240" fill="#e0f2fe" opacity="0.35"/>

  <!-- Frozen oil deposits (dark brown with ice mix, left) -->
  <rect x="140" y="190" width="160" height="50" fill="#2d1810" opacity="0.4" rx="8"/>

  <!-- Spray hose system (right) -->
  <!-- Hose reel -->
  <circle cx="548" cy="220" r="25" fill="#1a2535" stroke="#374151" stroke-width="2"/>
  <circle cx="548" cy="220" r="16" fill="#243246"/>
  <circle cx="548" cy="220" r="8" fill="#374151"/>
  <!-- Hose line -->
  <path d="M548,195 Q548,170 520,175 Q490,180 480,190 Q470,200 465,212" stroke="#374151" stroke-width="6" fill="none"/>
  <!-- Spray gun -->
  <rect x="444" y="205" width="28" height="14" rx="4" fill="#475569"/>
  <polygon points="444,205 444,219 430,212" fill="#22c55e"/>

  <!-- Hot water spray droplets on pipe (warming/cleaning) -->
  <circle cx="360" cy="185" r="4" fill="#fbbf24" opacity="0.5"/>
  <circle cx="375" cy="194" r="3.5" fill="#7dd3fc" opacity="0.7"/>
  <circle cx="390" cy="183" r="4.5" fill="#7dd3fc" opacity="0.65"/>
  <circle cx="405" cy="196" r="3" fill="#bae6fd" opacity="0.7"/>
  <circle cx="418" cy="186" r="4" fill="#38bdf8" opacity="0.65"/>
  <circle cx="370" cy="208" r="3.5" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="388" cy="218" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="410" cy="210" r="3" fill="#bae6fd" opacity="0.65"/>
  <circle cx="430" cy="195" r="3.5" fill="#7dd3fc" opacity="0.6"/>
  <!-- Steam/vapor from hot liquid -->
  <ellipse cx="390" cy="178" rx="25" ry="12" fill="#e0f2fe" opacity="0.08"/>
  <ellipse cx="410" cy="168" rx="18" ry="9" fill="#e0f2fe" opacity="0.06"/>
  <ellipse cx="370" cy="165" rx="14" ry="7" fill="#e0f2fe" opacity="0.05"/>

  <!-- Clean pipe (right half after cleaning) -->
  <rect x="300" y="190" width="160" height="50" fill="#475569" opacity="0.3" rx="4"/>
  <rect x="302" y="192" width="156" height="10" fill="white" opacity="0.04"/>

  <!-- Before/after labels -->
  <rect x="142" y="198" width="54" height="18" rx="2" fill="#1e3a5f" opacity="0.85"/>
  <text x="169" y="211" font-family="sans-serif" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle">凍結汚れ</text>
  <rect x="310" y="198" width="54" height="18" rx="2" fill="#064e3b" opacity="0.85"/>
  <text x="337" y="211" font-family="sans-serif" font-size="9" font-weight="700" fill="#22c55e" text-anchor="middle">洗浄後</text>

  <!-- Falling snowflakes -->
  <text x="100" y="120" font-family="sans-serif" font-size="16" fill="white" opacity="0.3">❄</text>
  <text x="310" y="100" font-family="sans-serif" font-size="12" fill="white" opacity="0.25">❄</text>
  <text x="490" y="130" font-family="sans-serif" font-size="14" fill="white" opacity="0.2">❄</text>
  <text x="230" y="140" font-family="sans-serif" font-size="10" fill="white" opacity="0.2">❄</text>
  <text x="440" y="90" font-family="sans-serif" font-size="10" fill="white" opacity="0.25">❄</text>

  <!-- YH880 cold-grade badge -->
  <rect x="140" y="100" width="180" height="70" rx="6" fill="#0a1520" opacity="0.9" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="230" y="126" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">凍結点 -8°C</text>
  <text x="230" y="144" font-family="sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">低温環境対応</text>
  <text x="230" y="162" font-family="monospace" font-size="9" fill="#4b6fa8" text-anchor="middle">Freezing Point: -8°C</text>

  <!-- Label strip -->
  <rect x="0" y="358" width="600" height="42" fill="#071812" opacity="0.9"/>
  <rect x="0" y="358" width="600" height="2" fill="#22c55e" opacity="0.5"/>
  <text x="300" y="377" font-family="sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">寒冷地対応 ｜ 低温環境（-3°C）での重質油洗浄</text>
  <text x="300" y="393" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Cold Climate / Heavy Oil Cleaning at -3°C</text>
</svg>
