<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg-bt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="dirty-liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2e0e"/>
    </linearGradient>
    <linearGradient id="clean-liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="beaker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="liq-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-bt)"/>

  <!-- Lab bench surface -->
  <rect x="0" y="340" width="800" height="110" fill="#e2e8f0"/>
  <rect x="0" y="340" width="800" height="4" fill="#94a3b8"/>

  <!-- Lab wall background -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="#bae6fd" stroke-width="1"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#bae6fd" stroke-width="1"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#bae6fd" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="340" stroke="#bae6fd" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="340" stroke="#bae6fd" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="340" stroke="#bae6fd" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="340" stroke="#bae6fd" stroke-width="1"/>
  <line x1="500" y1="0" x2="500" y2="340" stroke="#bae6fd" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="340" stroke="#bae6fd" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="340" stroke="#bae6fd" stroke-width="1"/>

  <!-- "A" label (covered/blind) -->
  <rect x="140" y="40" width="180" height="36" rx="6" fill="#374151"/>
  <text x="230" y="63" font-family="monospace" font-size="18" font-weight="700" fill="white" text-anchor="middle">SAMPLE A</text>

  <!-- "B" label (covered/blind) -->
  <rect x="480" y="40" width="180" height="36" rx="6" fill="#374151"/>
  <text x="570" y="63" font-family="monospace" font-size="18" font-weight="700" fill="white" text-anchor="middle">SAMPLE B</text>

  <!-- === BEAKER A (left, dirty/competitor) === -->
  <!-- Beaker glass -->
  <polygon points="170,100 290,100 310,340 150,340" fill="url(#beaker)" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Beaker spout -->
  <path d="M285,100 Q298,88 310,100" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Scale marks on beaker -->
  <line x1="160" y1="190" x2="172" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="230" x2="172" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="270" x2="172" y2="270" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="310" x2="172" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="146" y="194" font-family="monospace" font-size="9" fill="#64748b" text-anchor="end">300</text>
  <text x="146" y="274" font-family="monospace" font-size="9" fill="#64748b" text-anchor="end">100</text>

  <!-- Dirty liquid in beaker A -->
  <clipPath id="ba"><polygon points="170,100 290,100 310,340 150,340"/></clipPath>
  <rect x="148" y="200" width="164" height="140" fill="url(#dirty-liq)" opacity="0.85" clip-path="url(#ba)"/>
  <!-- Murky surface -->
  <ellipse cx="229" cy="201" rx="60" ry="8" fill="#92400e" opacity="0.7"/>
  <!-- Oil slick surface -->
  <ellipse cx="210" cy="200" rx="30" ry="5" fill="#d97706" opacity="0.4"/>
  <ellipse cx="250" cy="202" rx="20" ry="4" fill="#b45309" opacity="0.3"/>

  <!-- Dirty metal part submerged in A -->
  <g transform="translate(229, 270)">
    <circle r="32" fill="#5c2e0e" opacity="0.8"/>
    <rect x="-5" y="-38" width="10" height="14" rx="2" fill="#78350f"/>
    <g transform="rotate(60)"><rect x="-5" y="-38" width="10" height="14" rx="2" fill="#78350f"/></g>
    <g transform="rotate(120)"><rect x="-5" y="-38" width="10" height="14" rx="2" fill="#78350f"/></g>
    <g transform="rotate(180)"><rect x="-5" y="-38" width="10" height="14" rx="2" fill="#78350f"/></g>
    <g transform="rotate(240)"><rect x="-5" y="-38" width="10" height="14" rx="2" fill="#78350f"/></g>
    <g transform="rotate(300)"><rect x="-5" y="-38" width="10" height="14" rx="2" fill="#78350f"/></g>
    <circle r="10" fill="#44200a"/>
    <circle r="4" fill="#5c2e0e"/>
  </g>

  <!-- "VS" Center divider -->
  <line x1="400" y1="60" x2="400" y2="360" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="400" cy="215" r="34" fill="#1b5e43"/>
  <text x="400" y="222" font-family="sans-serif" font-size="18" font-weight="900" fill="white" text-anchor="middle">VS</text>

  <!-- === BEAKER B (right, YH880/clean) === -->
  <!-- Beaker glass -->
  <polygon points="510,100 630,100 650,340 490,340" fill="url(#beaker)" stroke="#94a3b8" stroke-width="2.5"/>
  <path d="M625,100 Q638,88 650,100" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Scale marks -->
  <line x1="500" y1="190" x2="512" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="500" y1="230" x2="512" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="500" y1="270" x2="512" y2="270" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="500" y1="310" x2="512" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="498" y="194" font-family="monospace" font-size="9" fill="#64748b" text-anchor="end">300</text>
  <text x="498" y="274" font-family="monospace" font-size="9" fill="#64748b" text-anchor="end">100</text>

  <!-- Clean liquid in beaker B -->
  <clipPath id="bb"><polygon points="510,100 630,100 650,340 490,340"/></clipPath>
  <rect x="488" y="200" width="164" height="140" fill="url(#clean-liq)" clip-path="url(#bb)"/>
  <!-- Clear water surface -->
  <ellipse cx="568" cy="201" rx="60" ry="7" fill="#38bdf8" opacity="0.5"/>
  <!-- Subtle refraction -->
  <line x1="510" y1="240" x2="630" y2="240" stroke="#7dd3fc" stroke-width="0.8" opacity="0.3"/>
  <line x1="508" y1="280" x2="632" y2="280" stroke="#7dd3fc" stroke-width="0.8" opacity="0.25"/>

  <!-- Clean metal part in B -->
  <g transform="translate(568, 268)">
    <circle r="32" fill="#64748b"/>
    <circle r="32" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="-8" cy="-10" rx="12" ry="7" fill="white" opacity="0.2" transform="rotate(-30)"/>
    <rect x="-5" y="-38" width="10" height="14" rx="2" fill="#94a3b8"/>
    <g transform="rotate(60)"><rect x="-5" y="-38" width="10" height="14" rx="2" fill="#94a3b8"/></g>
    <g transform="rotate(120)"><rect x="-5" y="-38" width="10" height="14" rx="2" fill="#94a3b8"/></g>
    <g transform="rotate(180)"><rect x="-5" y="-38" width="10" height="14" rx="2" fill="#94a3b8"/></g>
    <g transform="rotate(240)"><rect x="-5" y="-38" width="10" height="14" rx="2" fill="#94a3b8"/></g>
    <g transform="rotate(300)"><rect x="-5" y="-38" width="10" height="14" rx="2" fill="#94a3b8"/></g>
    <circle r="10" fill="#e2e8f0"/>
    <circle r="4" fill="#94a3b8"/>
    <!-- Clean glow -->
    <circle r="32" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Result labels under beakers -->
  <rect x="160" y="348" width="140" height="22" rx="3" fill="#44200a" opacity="0.15"/>
  <text x="230" y="363" font-family="sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">汚れが残存</text>
  <rect x="500" y="348" width="140" height="22" rx="3" fill="#064e3b" opacity="0.15"/>
  <text x="570" y="363" font-family="sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">清浄に除去</text>

  <!-- Label strip -->
  <rect x="0" y="390" width="800" height="60" fill="#071812" opacity="0.9"/>
  <rect x="0" y="390" width="800" height="2" fill="#22c55e" opacity="0.5"/>
  <text x="400" y="416" font-family="sans-serif" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">ブラインド比較試験 · 同一条件下での洗浄性能比較</text>
  <text x="400" y="436" font-family="sans-serif" font-size="11" fill="#86efac" text-anchor="middle">製品名を伏せた状態で競合他社品と並行試験 / Blind Competitive Performance Test</text>
  <text x="400" y="450" font-family="sans-serif" font-size="9" fill="#4a6080" text-anchor="middle">試験条件・詳細結果はお問い合わせください</text>
</svg>
