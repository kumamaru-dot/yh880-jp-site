<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="part-clean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="mist">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Lab background -->
  <rect width="600" height="450" fill="url(#bg1)"/>
  <!-- Bench -->
  <rect x="0" y="310" width="600" height="140" fill="url(#bench)"/>
  <rect x="0" y="310" width="600" height="6" fill="#94a3b8"/>
  <!-- Wall grid -->
  <line x1="0" y1="80" x2="600" y2="80" stroke="#bae6fd" stroke-width="1"/>
  <line x1="0" y1="160" x2="600" y2="160" stroke="#bae6fd" stroke-width="1"/>
  <line x1="0" y1="240" x2="600" y2="240" stroke="#bae6fd" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="310" stroke="#bae6fd" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="310" stroke="#bae6fd" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="310" stroke="#bae6fd" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="310" stroke="#bae6fd" stroke-width="1"/>
  <line x1="500" y1="0" x2="500" y2="310" stroke="#bae6fd" stroke-width="1"/>

  <!-- Microscope (left) -->
  <rect x="60" y="200" width="14" height="100" rx="4" fill="#475569"/>
  <rect x="44" y="290" width="46" height="12" rx="3" fill="#334155"/>
  <rect x="62" y="160" width="10" height="50" rx="3" fill="#64748b"/>
  <ellipse cx="67" cy="158" rx="30" ry="22" fill="#334155"/>
  <ellipse cx="67" cy="158" rx="22" ry="16" fill="#1e293b"/>
  <circle cx="67" cy="158" r="10" fill="#0369a1"/>
  <circle cx="67" cy="158" r="5" fill="#0ea5e9"/>
  <rect x="75" y="200" width="8" height="40" rx="2" fill="#64748b" transform="rotate(15, 79, 220)"/>
  <rect x="82" y="238" width="20" height="6" rx="2" fill="#334155"/>

  <!-- Clean spray mist cloud -->
  <ellipse cx="300" cy="220" rx="160" ry="100" fill="#0ea5e9" opacity="0.06" filter="url(#mist)"/>
  <ellipse cx="300" cy="220" rx="120" ry="70" fill="#0ea5e9" opacity="0.08" filter="url(#mist)"/>

  <!-- Spray droplets floating -->
  <circle cx="210" cy="180" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="230" cy="160" r="3" fill="#7dd3fc" opacity="0.55"/>
  <circle cx="250" cy="190" r="5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="280" cy="155" r="3.5" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="320" cy="165" r="4" fill="#38bdf8" opacity="0.55"/>
  <circle cx="355" cy="175" r="3" fill="#7dd3fc" opacity="0.5"/>
  <circle cx="380" cy="150" r="4.5" fill="#38bdf8" opacity="0.55"/>
  <circle cx="400" cy="190" r="3" fill="#7dd3fc" opacity="0.5"/>
  <circle cx="195" cy="210" r="3" fill="#bae6fd" opacity="0.6"/>
  <circle cx="420" cy="210" r="3.5" fill="#bae6fd" opacity="0.55"/>

  <!-- === MAIN METAL PARTS === -->
  <!-- Precision gear (center-left) -->
  <g transform="translate(240, 240)">
    <circle r="55" fill="url(#part-clean)"/>
    <circle r="55" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="-14" cy="-16" rx="22" ry="12" fill="white" opacity="0.2" transform="rotate(-30)"/>
    <rect x="-6" y="-63" width="12" height="16" rx="2" fill="#94a3b8"/>
    <rect x="-6" y="47" width="12" height="16" rx="2" fill="#94a3b8"/>
    <rect x="-63" y="-6" width="16" height="12" rx="2" fill="#94a3b8"/>
    <rect x="47" y="-6" width="16" height="12" rx="2" fill="#94a3b8"/>
    <g transform="rotate(45)"><rect x="-6" y="-63" width="12" height="16" rx="2" fill="#94a3b8"/></g>
    <g transform="rotate(-45)"><rect x="-6" y="-63" width="12" height="16" rx="2" fill="#94a3b8"/></g>
    <g transform="rotate(135)"><rect x="-6" y="-63" width="12" height="16" rx="2" fill="#94a3b8"/></g>
    <g transform="rotate(-135)"><rect x="-6" y="-63" width="12" height="16" rx="2" fill="#94a3b8"/></g>
    <circle r="18" fill="#f0f9ff"/>
    <circle r="12" fill="#e0f2fe"/>
    <circle r="5" fill="#94a3b8"/>
    <!-- Green glow -->
    <circle r="55" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Small bearing (top-right) -->
  <g transform="translate(370, 185)">
    <circle r="38" fill="url(#part-clean)"/>
    <circle r="28" fill="#e0f2fe"/>
    <circle r="22" fill="url(#part-clean)"/>
    <circle r="10" fill="#f0f9ff"/>
    <!-- Ball bearings -->
    <circle cx="0" cy="-25" r="5" fill="#cbd5e1"/>
    <circle cx="24" cy="-6" r="5" fill="#cbd5e1"/>
    <circle cx="15" cy="21" r="5" fill="#cbd5e1"/>
    <circle cx="-15" cy="21" r="5" fill="#cbd5e1"/>
    <circle cx="-24" cy="-6" r="5" fill="#cbd5e1"/>
    <circle r="38" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Small precision rod/pin (right) -->
  <g transform="translate(460, 255) rotate(-20)">
    <rect x="-8" y="-60" width="16" height="120" rx="8" fill="url(#part-clean)"/>
    <ellipse cx="0" cy="-60" rx="8" ry="4" fill="#cbd5e1"/>
    <rect x="-5" y="-20" width="10" height="4" rx="1" fill="#cbd5e1"/>
    <rect x="-5" y="0" width="10" height="4" rx="1" fill="#cbd5e1"/>
    <rect x="-5" y="20" width="10" height="4" rx="1" fill="#cbd5e1"/>
  </g>

  <!-- Small hex bolt cluster -->
  <g transform="translate(155, 240)">
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="url(#part-clean)"/>
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <circle r="10" fill="#e0f2fe"/>
    <circle r="5" fill="#94a3b8"/>
  </g>
  <g transform="translate(180, 268)">
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="url(#part-clean)"/>
    <circle r="7" fill="#e0f2fe"/>
    <circle r="3.5" fill="#94a3b8"/>
  </g>

  <!-- Caliper tool (background) -->
  <rect x="90" y="270" width="110" height="10" rx="3" fill="#475569" opacity="0.5"/>
  <rect x="90" y="275" width="110" height="2" fill="#64748b" opacity="0.5"/>
  <rect x="88" y="264" width="6" height="22" rx="1" fill="#475569" opacity="0.5"/>
  <rect x="195" y="264" width="6" height="22" rx="1" fill="#475569" opacity="0.5"/>

  <!-- Label strip -->
  <rect x="0" y="380" width="600" height="70" fill="#0a2418" opacity="0.88"/>
  <rect x="0" y="380" width="600" height="3" fill="#22c55e" opacity="0.6"/>
  <text x="300" y="410" font-family="sans-serif" font-size="16" font-weight="700" fill="#4ade80" text-anchor="middle">YH880-1 · 金属用 環境対応型水系洗浄剤</text>
  <text x="300" y="432" font-family="sans-serif" font-size="12" fill="#86efac" text-anchor="middle">精密加工・ハイテク産業向け / Precision Machining Grade</text>
</svg>
