<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="machine-m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="coolant" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-m" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30,0 L0,0 L0,30" stroke="#243246" stroke-width="0.7" fill="none"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="url(#bg-m)"/>
  <rect width="600" height="400" fill="url(#grid-m)" opacity="0.25"/>

  <!-- Floor -->
  <rect x="0" y="330" width="600" height="70" fill="#111d2e"/>
  <rect x="0" y="330" width="600" height="3" fill="#243246"/>

  <!-- CNC Machine body (center) -->
  <rect x="160" y="60" width="280" height="270" rx="6" fill="url(#machine-m)" stroke="#374151" stroke-width="2.5"/>
  <!-- Machine enclosure -->
  <rect x="172" y="72" width="256" height="200" rx="4" fill="#111d2e" stroke="#243246" stroke-width="1.5"/>
  <!-- Viewing window -->
  <rect x="185" y="85" width="140" height="120" rx="3" fill="#0c1a28" stroke="#1e3a50" stroke-width="1.5"/>
  <rect x="187" y="87" width="136" height="116" rx="2" fill="#071218" opacity="0.9"/>
  <!-- Window reflection -->
  <line x1="195" y1="90" x2="200" y2="200" stroke="white" stroke-width="1.5" opacity="0.05"/>
  <line x1="205" y1="88" x2="210" y2="198" stroke="white" stroke-width="0.8" opacity="0.04"/>

  <!-- Spindle/cutting tool (inside window) -->
  <rect x="245" y="90" width="10" height="60" rx="2" fill="#64748b"/>
  <polygon points="245,150 255,150 250,175" fill="#94a3b8"/>
  <!-- Tool tip cutting -->
  <circle cx="250" cy="178" r="6" fill="#f59e0b" opacity="0.8"/>
  <line x1="250" y1="178" x2="240" y2="185" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
  <line x1="250" y1="178" x2="260" y2="183" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>

  <!-- Workpiece (being machined) -->
  <rect x="215" y="170" width="70" height="30" rx="3" fill="#475569"/>
  <rect x="215" y="170" width="70" height="10" rx="2" fill="#64748b"/>

  <!-- Metal chips flying -->
  <path d="M248 180 Q255 168 262 174" stroke="#d97706" stroke-width="2" fill="none"/>
  <path d="M252 182 Q258 168 265 176" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
  <path d="M244 183 Q240 170 248 168" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <circle cx="265" cy="174" r="2" fill="#f59e0b"/>
  <circle cx="262" cy="166" r="1.5" fill="#d97706"/>
  <circle cx="238" cy="168" r="2" fill="#f59e0b"/>

  <!-- Coolant spray (visible through window) -->
  <rect x="188" y="88" width="136" height="116" fill="url(#coolant)" opacity="0.15" rx="2"/>
  <circle cx="230" cy="160" r="3" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="268" cy="148" r="4" fill="#38bdf8" opacity="0.55"/>
  <circle cx="240" cy="140" r="2.5" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="278" cy="165" r="3" fill="#bae6fd" opacity="0.5"/>
  <circle cx="220" cy="175" r="3.5" fill="#7dd3fc" opacity="0.55"/>
  <circle cx="258" cy="135" r="2" fill="#bae6fd" opacity="0.6"/>

  <!-- Machine right panel -->
  <rect x="340" y="85" width="78" height="185" rx="3" fill="#1e2535" stroke="#243246" stroke-width="1"/>
  <!-- Display screen -->
  <rect x="348" y="93" width="62" height="50" rx="2" fill="#021a14"/>
  <text x="379" y="112" font-family="monospace" font-size="8" fill="#22c55e" text-anchor="middle">RPM: 3200</text>
  <text x="379" y="125" font-family="monospace" font-size="8" fill="#16a34a" text-anchor="middle">FEED: 0.2</text>
  <text x="379" y="138" font-family="monospace" font-size="8" fill="#4ade80" text-anchor="middle">COOL: ON</text>
  <!-- Buttons -->
  <circle cx="362" cy="162" r="6" fill="#22c55e"/>
  <circle cx="380" cy="162" r="6" fill="#374151"/>
  <circle cx="398" cy="162" r="6" fill="#ef4444" opacity="0.7"/>
  <!-- Dial -->
  <circle cx="379" cy="196" r="18" fill="#111d2e" stroke="#374151" stroke-width="1.5"/>
  <line x1="379" y1="196" x2="379" y2="180" stroke="#64748b" stroke-width="2"/>
  <circle cx="379" cy="226" r="14" fill="#111d2e" stroke="#374151" stroke-width="1.5"/>
  <line x1="379" y1="226" x2="387" y2="215" stroke="#64748b" stroke-width="2"/>

  <!-- Machine controls bottom panel -->
  <rect x="172" y="278" width="256" height="28" rx="3" fill="#1a2535" stroke="#243246" stroke-width="1"/>
  <circle cx="195" cy="292" r="7" fill="#22c55e"/>
  <circle cx="218" cy="292" r="7" fill="#374151"/>
  <rect x="238" y="285" width="80" height="14" rx="3" fill="#111d2e" stroke="#243246" stroke-width="1"/>
  <text x="278" y="296" font-family="monospace" font-size="8" fill="#4ade80" text-anchor="middle">AUTO WASH</text>
  <circle cx="346" cy="292" r="7" fill="#374151"/>
  <circle cx="368" cy="292" r="7" fill="#374151"/>
  <circle cx="408" cy="292" r="7" fill="#ef4444" opacity="0.7"/>

  <!-- Chip tray / coolant collection -->
  <rect x="160" y="306" width="280" height="18" rx="4" fill="#243246"/>
  <!-- Metal chips in tray -->
  <path d="M180 312 Q184 308 188 313" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <path d="M195 310 Q199 306 203 311" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
  <path d="M210 313 Q213 308 217 312" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <path d="M225 311 Q228 307 232 312" stroke="#f59e0b" stroke-width="1" fill="none"/>

  <!-- Coolant stream from machine base -->
  <path d="M200,324 Q200,335 205,345" stroke="#7dd3fc" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M220,324 Q218,336 216,346" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.45"/>

  <!-- Coolant tank (left) -->
  <rect x="60" y="220" width="90" height="100" rx="4" fill="#1a2535" stroke="#374151" stroke-width="1.5"/>
  <rect x="70" y="260" width="70" height="52" rx="2" fill="#0c1a28"/>
  <!-- Coolant level -->
  <rect x="70" y="275" width="70" height="37" rx="2" fill="#0369a1" opacity="0.7"/>
  <rect x="70" y="275" width="70" height="6" fill="#38bdf8" opacity="0.4"/>
  <rect x="60" y="230" width="90" height="10" fill="#243246"/>
  <text x="105" y="244" font-family="sans-serif" font-size="8" fill="#4ade80" text-anchor="middle">COOLANT</text>
  <!-- Pipe from tank to machine -->
  <rect x="150" y="258" width="12" height="16" fill="#374151"/>
  <rect x="148" y="262" width="16" height="8" fill="#243246"/>

  <!-- Right: finished parts -->
  <rect x="460" y="190" width="110" height="80" rx="4" fill="#1a2535" stroke="#374151" stroke-width="1.5"/>
  <text x="515" y="210" font-family="sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">洗浄済み部品</text>
  <!-- Clean parts in box -->
  <rect x="472" y="218" width="28" height="18" rx="2" fill="#64748b"/>
  <rect x="474" y="220" width="24" height="8" rx="1" fill="#94a3b8"/>
  <rect x="508" y="220" width="24" height="18" rx="2" fill="#64748b"/>
  <circle cx="520" cy="229" r="7" fill="#94a3b8"/>
  <rect x="540" y="218" width="18" height="22" rx="2" fill="#64748b"/>
  <circle cx="549" cy="229" r="5" fill="#94a3b8"/>

  <!-- Label strip -->
  <rect x="0" y="358" width="600" height="42" fill="#071812" opacity="0.9"/>
  <rect x="0" y="358" width="600" height="2" fill="#22c55e" opacity="0.5"/>
  <text x="300" y="377" font-family="sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">機械加工 ｜ 工作機械・治具の日常脱脂洗浄</text>
  <text x="300" y="393" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Machining / CNC Machine &amp; Tool Degreasing</text>
</svg>
