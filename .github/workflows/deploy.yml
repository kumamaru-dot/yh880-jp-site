name: Build and Deploy to CORESERVER

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: FTP Deploy to CORESERVER
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: s177.coreserver.jp
          username: glocal
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: public_html/glocal-action.com/yh880/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
